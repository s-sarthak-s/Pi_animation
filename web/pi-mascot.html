<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pi Mascot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root { --bg:#140d24; --grid:#241b3a; --neon:#ff2fb0; --cyan:#00eaff; }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 600px at 50% 120%, #2a1550 0%, var(--bg) 60%),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,47,176,.05) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(0,234,255,.05) 39px 40px);
    color:#e6dcff; font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
    user-select:none;
  }
  .stage { filter: drop-shadow(0 20px 30px rgba(0,234,255,.15)); }
  svg { display:block; }
  .label {
    margin-top:26px; letter-spacing:.35em; text-transform:uppercase; font-size:13px;
    color:var(--cyan); text-shadow:0 0 10px rgba(0,234,255,.6);
  }
  .hint { margin-top:8px; font-size:11px; color:#6a6088; letter-spacing:.1em; }
  .btn {
    margin-top:14px; background:transparent; border:1px solid var(--grid); color:#b9a9ff;
    padding:6px 14px; border-radius:8px; font:inherit; font-size:12px; cursor:pointer;
  }
  .btn:hover { border-color:var(--neon); color:#fff; }
</style>
</head>
<body>
  <div class="stage">
    <!-- 160x160 viewbox. Mascot is a blue "π" built from rects, Claude-style pixel body. -->
    <svg id="svg" width="320" height="320" viewBox="0 0 160 160">
      <defs>
        <clipPath id="ground"><rect x="0" y="0" width="160" height="140" /></clipPath>
      </defs>

      <!-- shadow -->
      <ellipse id="shadow" cx="80" cy="140" rx="42" ry="7" fill="#000" opacity="0.35" />

      <g id="mascot">
        <!-- arms (behind body) -->
        <rect id="armL" x="24" y="66" width="10" height="26" rx="5" fill="#1f6fff" />
        <rect id="armR" x="126" y="66" width="10" height="26" rx="5" fill="#1f6fff" />

        <!-- prop that some animations reveal (a little pie) -->
        <g id="pie" opacity="0">
          <rect x="128" y="40" width="26" height="10" rx="4" fill="#e9b45a" />
          <rect x="130" y="34" width="22" height="8" rx="4" fill="#f2c976" />
          <rect x="136" y="26" width="2" height="6" fill="#8a7fb0" />
          <rect x="142" y="24" width="2" height="8" fill="#8a7fb0" />
        </g>

        <!-- BODY = the π : top bar + two legs -->
        <g id="body">
          <rect id="bar"  x="30" y="40" width="100" height="20" rx="8" fill="#2e7fff" />
          <g clip-path="url(#ground)">
            <rect id="legL" x="46" y="58" width="18" height="70" rx="8" fill="#1f6fff" />
            <rect id="legR" x="96" y="58" width="18" height="70" rx="8" fill="#1f6fff" />
          </g>
          <!-- little curl on the right leg (π foot) -->
          <rect id="foot" x="112" y="118" width="18" height="12" rx="6" fill="#1f6fff" />

          <!-- face on the bar -->
          <g id="face">
            <rect id="eyeL" x="52" y="44" width="12" height="12" rx="6" fill="#f4efff" />
            <rect id="eyeR" x="82" y="44" width="12" height="12" rx="6" fill="#f4efff" />
            <rect id="pupL" x="57" y="49" width="5" height="5" rx="2.5" fill="#0a1030" />
            <rect id="pupR" x="87" y="49" width="5" height="5" rx="2.5" fill="#0a1030" />
            <rect id="mouth" x="66" y="60" width="16" height="4" rx="2" fill="#0a1030" opacity="0.75" />
          </g>
        </g>

        <!-- thought dots for 'think' -->
        <g id="think" opacity="0">
          <circle cx="120" cy="34" r="3" fill="#00eaff" />
          <circle cx="130" cy="26" r="4" fill="#00eaff" />
          <circle cx="142" cy="16" r="5" fill="#00eaff" />
        </g>

        <!-- floating z's for 'sleepy' -->
        <g id="zzz" opacity="0" font-family="ui-monospace, monospace" font-weight="bold">
          <text x="118" y="36" font-size="10" fill="#8a7fb0">z</text>
          <text x="129" y="25" font-size="13" fill="#9d90c4">z</text>
          <text x="141" y="12" font-size="16" fill="#b3a6dd">z</text>
        </g>
      </g>
    </svg>
  </div>

  <div class="label" id="label">idle</div>
  <div class="hint">a new animation plays each loop — every window gets a random color</div>
  <div>
    <button class="btn" id="shuffle">shuffle ↻</button>
    <button class="btn" id="recolor">recolor 🎨</button>
    <button class="btn" id="dance">dance 💃</button>
    <button class="btn" id="crazy">crazy 🤪</button>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const mascot = $("mascot"), body = $("body"), face = $("face");
const armL = $("armL"), armR = $("armR"), legL = $("legL"), legR = $("legR");
const eyeL = $("eyeL"), eyeR = $("eyeR"), pupL = $("pupL"), pupR = $("pupR");
const mouth = $("mouth"), pie = $("pie"), think = $("think"), zzz = $("zzz"), shadow = $("shadow");
const label = $("label");

// ── palettes: every window load picks one at random ─────────────────────────
const PALETTES = [
  ["blue",    "#2e7fff", "#1f6fff"],
  ["cyan",    "#00d6eb", "#0097b8"],
  ["pink",    "#ff41b1", "#cc2689"],
  ["purple",  "#ae60ff", "#7d3ed6"],
  ["green",   "#2bdc80", "#189d57"],
  ["orange",  "#ff9134", "#d25b1c"],
  ["red",     "#ff4c5b", "#c72b3a"],
  ["gold",    "#ffc936", "#d29119"],
  ["mint",    "#34d399", "#25986e"],
  ["coral",   "#ff6f61", "#d65045"],
  ["sky",     "#38bdf8", "#1d86c4"],
  ["lime",    "#a3e635", "#76ab22"],
  ["magenta", "#e850dc", "#aa37a0"],
  ["indigo",  "#6366f1", "#4949ad"],
  ["rose",    "#fb7185", "#b55160"],
  ["ice",     "#b4dcff", "#82a0be"],
];
let paletteIndex = Math.floor(Math.random() * PALETTES.length);
function applyPalette() {
  const [, light, dark] = PALETTES[paletteIndex];
  $("bar").setAttribute("fill", light);
  for (const el of [armL, armR, legL, legR, $("foot")]) el.setAttribute("fill", dark);
}
function recolor() {
  let i;
  do { i = Math.floor(Math.random() * PALETTES.length); } while (i === paletteIndex && PALETTES.length > 1);
  paletteIndex = i;
  applyPalette();
}
const routineLabel = (name) => (name === "pieTime" ? "pie time" : name) + " · " + PALETTES[paletteIndex][0];

// reset everything to neutral pose before each routine
function reset() {
  gsap.set([mascot, body, face, armL, armR, legL, legR, eyeL, eyeR, pupL, pupR, mouth], { clearProps: "all" });
  gsap.set(pie, { opacity: 0 });
  gsap.set(think, { opacity: 0 });
  gsap.set(zzz, { opacity: 0 });
  gsap.set([legL, legR], { transformOrigin: "50% 0%" });
  gsap.set([armL, armR], { transformOrigin: "50% 0%" });
}

// a subtle blink we sprinkle into idle moments
function blink(tl, at) {
  tl.to([eyeL, eyeR], { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06 }, at)
    .to([eyeL, eyeR], { scaleY: 1, duration: 0.08 }, at + 0.1);
}

// ── ROUTINES ────────────────────────────────────────────────────────────────
const routines = {
  wave() {
    const tl = gsap.timeline();
    tl.to(body, { rotation: -4, svgOrigin: "80 128", duration: .3, ease: "power2.out" })
      .to(armR, { rotation: -120, transformOrigin: "50% 0%", duration: .25, ease: "back.out(2)" }, "<")
      .to(armR, { rotation: -80, duration: .18, yoyo: true, repeat: 5, ease: "sine.inOut" })
      .to(armR, { rotation: 0, duration: .25, ease: "power2.inOut" })
      .to(body, { rotation: 0, duration: .3 }, "<");
    blink(tl, .4);
    return tl;
  },
  jump() {
    const tl = gsap.timeline();
    tl.to(body, { scaleY: .78, y: 12, transformOrigin: "50% 100%", duration: .12, ease: "power3.in" })
      .to([armL, armR], { y: 10, duration: .12 }, "<")
      .to(mascot, { y: -70, duration: .34, ease: "sine.out" })
      .to(body, { scaleY: 1.12, y: 0, duration: .34, ease: "sine.out" }, "<")
      .to([armL, armR], { rotation: (i)=>i? 30:-30, transformOrigin:"50% 0%", duration:.34 }, "<")
      .to(mascot, { y: 0, duration: .26, ease: "power3.in" })
      .to(body, { scaleY: .85, duration: .1, ease: "power2.in" }, "-=.05")
      .to(body, { scaleY: 1, duration: .18, ease: "back.out(3)" })
      .to([armL, armR], { rotation: 0, y: 0, duration: .18 }, "<");
    return tl;
  },
  dance() {
    const tl = gsap.timeline();
    tl.to(mascot, { x: -10, rotation: -5, transformOrigin: "50% 100%", duration: .28, ease: "sine.inOut" })
      .to(armL, { rotation: -40, transformOrigin:"50% 0%", duration:.28 }, "<")
      .to(armR, { rotation: 40, transformOrigin:"50% 0%", duration:.28 }, "<")
      .to([pupL, pupR], { x: -3, duration:.28 }, "<")
      .to(mascot, { x: 10, rotation: 5, duration: .28, ease: "sine.inOut" })
      .to(armL, { rotation: 40, duration:.28 }, "<")
      .to(armR, { rotation: -40, duration:.28 }, "<")
      .to([pupL, pupR], { x: 3, duration:.28 }, "<");
    tl.repeat(3).yoyo(false);
    const wrap = gsap.timeline();
    wrap.add(tl).to(mascot, { x:0, rotation:0, duration:.2 }).to([armL,armR,pupL,pupR], { rotation:0, x:0, duration:.2 }, "<");
    return wrap;
  },
  think() {
    const tl = gsap.timeline();
    tl.to([pupL, pupR], { x: 4, y: -3, duration: .3 })
      .to(armR, { rotation: -70, y: -6, transformOrigin: "50% 0%", duration: .3, ease: "power2.out" }, "<")
      .to(think, { opacity: 1, duration: .2 })
      .from(think.children, { scale: 0, transformOrigin:"50% 50%", stagger: .18, duration: .25, ease: "back.out(2)" })
      .to({}, { duration: .6 })
      .to(think, { opacity: 0, duration: .2 })
      .to(armR, { rotation: 0, y: 0, duration: .3 }, "<")
      .to([pupL, pupR], { x: 0, y: 0, duration: .3 }, "<");
    return tl;
  },
  flex() {
    const tl = gsap.timeline();
    tl.to(mouth, { scaleX: 1.4, y: -1, transformOrigin: "50% 50%", duration: .2 })
      .to(armL, { rotation: 130, transformOrigin:"50% 0%", duration:.3, ease:"back.out(2)" }, "<")
      .to(armR, { rotation: -130, transformOrigin:"50% 0%", duration:.3, ease:"back.out(2)" }, "<")
      .to(body, { scaleX: 1.06, scaleY: .96, transformOrigin:"50% 100%", duration:.18, yoyo:true, repeat:3, ease:"sine.inOut" })
      .to([armL, armR], { rotation: 0, duration:.3 })
      .to(mouth, { scaleX: 1, y: 0, duration:.2 }, "<");
    return tl;
  },
  spin() {
    const tl = gsap.timeline();
    tl.to([armL, armR], { rotation: (i) => i ? -60 : 60, transformOrigin: "50% 0%", duration: .25 }, 0)
      .to(mascot, { rotation: 360, transformOrigin: "50% 60%", duration: .7, ease: "power1.inOut" }, 0)
      .to([armL, armR], { rotation: 0, duration: .25 }, .55);
    blink(tl, .8);
    return tl;
  },
  cheer() {
    const tl = gsap.timeline();
    tl.to(mouth, { scaleX: 1.5, scaleY: 1.9, transformOrigin: "50% 50%", duration: .2 }, 0)
      .to([armL, armR], { rotation: (i) => i ? -140 : 140, transformOrigin: "50% 0%", duration: .25, ease: "back.out(2)" }, 0)
      .to(mascot, { y: -18, duration: .16, yoyo: true, repeat: 3, ease: "sine.inOut" })
      .to([armL, armR], { rotation: 0, duration: .3 })
      .to(mouth, { scaleX: 1, scaleY: 1, duration: .2 }, "<");
    return tl;
  },
  sleepy() {
    const tl = gsap.timeline();
    tl.to([eyeL, eyeR], { scaleY: 0.12, transformOrigin: "50% 50%", duration: .4 })
      .to(mascot, { rotation: 3, transformOrigin: "50% 100%", duration: .9, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0)
      .to(zzz, { opacity: 1, duration: .2 }, .3)
      .from(zzz.children, { opacity: 0, y: 6, stagger: .3, duration: .4 }, .3)
      .to({}, { duration: .5 })
      .to(zzz, { opacity: 0, duration: .2 })
      .to([eyeL, eyeR], { scaleY: 1, duration: .3 }, "<");
    return tl;
  },
  peek() {
    const tl = gsap.timeline();
    tl.to(mascot, { y: 55, scaleY: .55, transformOrigin: "50% 100%", duration: .35, ease: "power2.in" })
      .to([pupL, pupR], { x: -4, duration: .2 })
      .to([pupL, pupR], { x: 4, duration: .3 })
      .to(mascot, { y: 0, scaleY: 1, duration: .45, ease: "back.out(2.5)" })
      .to([pupL, pupR], { x: 0, duration: .2 }, "<");
    return tl;
  },
  wiggle() {
    const tl = gsap.timeline();
    tl.to(mascot, { rotation: -6, transformOrigin: "50% 100%", duration: .12, ease: "sine.inOut" })
      .to(mascot, { rotation: 6, duration: .16, yoyo: true, repeat: 5, ease: "sine.inOut" })
      .to(mascot, { rotation: 0, duration: .12 });
    blink(tl, .3);
    return tl;
  },
  levitate() {
    const tl = gsap.timeline();
    tl.to(mascot, { y: -30, duration: .8, ease: "sine.inOut" })
      .to(shadow, { scaleX: .6, opacity: .18, transformOrigin: "50% 50%", duration: .8 }, 0)
      .to([armL, armR], { rotation: (i) => i ? -25 : 25, transformOrigin: "50% 0%", duration: .8 }, 0)
      .to(mascot, { y: -22, duration: .5, yoyo: true, repeat: 1, ease: "sine.inOut" })
      .to(mascot, { y: 0, duration: .6, ease: "sine.inOut" })
      .to(shadow, { scaleX: 1, opacity: .35, duration: .6 }, "<")
      .to([armL, armR], { rotation: 0, duration: .6 }, "<");
    blink(tl, 1.2);
    return tl;
  },
  pieTime() {
    const tl = gsap.timeline();
    tl.to(armR, { rotation: -60, transformOrigin:"50% 0%", duration:.3, ease:"power2.out" })
      .set(pie, { opacity: 1 }, "<")
      .fromTo(pie, { y: 6, scale: .6, transformOrigin:"50% 100%" }, { y: 0, scale: 1, duration:.3, ease:"back.out(2)" }, "<")
      .to(mascot, { y:-4, duration:.2, yoyo:true, repeat:3, ease:"sine.inOut" })
      .to([pupL,pupR], { x: 4, duration:.2 }, "<")
      .to(pie, { opacity: 0, y: -8, duration:.3 })
      .to(armR, { rotation: 0, duration:.3 }, "<")
      .to([pupL,pupR], { x:0, duration:.3 }, "<");
    return tl;
  },
};

const names = Object.keys(routines);
let last = "";
let mode = "shuffle";          // "shuffle" | "dance" | "crazy"
let marathonIndex = 0;
let crazyColorTimer = null;

function stopCrazyColors() {
  if (crazyColorTimer) { clearInterval(crazyColorTimer); crazyColorTimer = null; }
}

function setMode(next) {
  mode = next;
  marathonIndex = 0;
  stopCrazyColors();
  if (mode === "crazy") crazyColorTimer = setInterval(recolor, 280);
  gsap.globalTimeline.getChildren().forEach(t => t.kill());
  playNext();
}

function playNext() {
  reset();
  // continuous idle bob + breathing under everything
  gsap.to(shadow, { scaleX: 0.9, transformOrigin:"50% 50%", duration: 1, yoyo:true, repeat:1 });
  let name;
  if (mode === "shuffle") {
    do { name = names[Math.floor(Math.random() * names.length)]; } while (name === last && names.length > 1);
  } else {
    if (marathonIndex >= names.length) {          // one full pass done
      const wasCrazy = mode === "crazy";
      mode = "shuffle";
      stopCrazyColors();
      label.textContent = (wasCrazy ? "crazy over 😵" : "encore! ✨") + " · " + PALETTES[paletteIndex][0];
      gsap.delayedCall(1.2, playNext);
      return;
    }
    name = names[marathonIndex++];
  }
  last = name;
  label.textContent = routineLabel(name) + (mode !== "shuffle" ? `  (${marathonIndex}/${names.length})` : "");
  const tl = routines[name]();
  if (mode === "crazy") tl.timeScale(2);
  tl.eventCallback("onComplete", () => gsap.delayedCall(mode === "crazy" ? 0.08 : mode === "dance" ? 0.2 : 0.35, playNext));
}

document.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); setMode("shuffle"); } });
$("shuffle").addEventListener("click", () => { setMode("shuffle"); });
$("recolor").addEventListener("click", () => { recolor(); label.textContent = routineLabel(last || "idle"); });
$("dance").addEventListener("click", () => { setMode("dance"); });
$("crazy").addEventListener("click", () => { setMode("crazy"); });

applyPalette();
playNext();
</script>
</body>
</html>
